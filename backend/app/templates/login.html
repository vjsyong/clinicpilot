<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — ClinicPilot</title>
  <link rel="stylesheet" href="./public/triage/tokens.css">
  <link rel="stylesheet" href="./public/triage/base.css">
</head>
<body>
  <main class="content" id="main">
    <div class="page-head">
      <div>
        <h1 class="page-title">ClinicPilot</h1>
        <div class="page-desc">Sign in to the clinic workbench.</div>
      </div>
    </div>
    <div class="card">
      <form method="post" action="./login" class="stack">
        {{NEXT_FIELD}}
        <label for="password">Demo password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" autofocus
               data-testid="login-password">
        {{ERROR_BLOCK}}
        <div class="row">
          <button class="btn primary" type="submit" data-testid="login-submit">Sign in</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
