[project]
name = "clinicpilot-backend"
version = "0.1.0"
description = "ClinicPilot MVP backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.54,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<1",
    "sentence-transformers>=3.2,<6",
    "sqlalchemy>=2.0,<3",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/evals/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-ra"
