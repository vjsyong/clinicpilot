# CI override. Always run with an isolated project name so the named data
# volume and containers can never collide with a real deployment:
#
#   docker compose -p "ci-clinicpilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
#     -f compose.yaml -f compose.ci.yaml up -d --wait app model-stub
#
# The generation provider is a deterministic local stub. No Cloudflare
# connector and no production credential is used. The CI password hash below
# is temporary and corresponds to the non-secret test password only.

services:
  app:
    image: clinicpilot:${GITHUB_SHA:-local}
    pull_policy: never
    environment:
      APP_ENV: test
      DEMO_PATH_PREFIX: /ci-clinicpilot-0123456789/
      DEMO_PASSWORD_HASH: '$$argon2id$$v=19$$m=65536,t=3,p=4$$r1k152euUT2GSIwfX5Cktw$$QgbThqLxmaEXvxnVL8rb6NlxtzTiQqhISPruf0hUlk8'
      INTERNAL_TOOL_KEY: ci-internal-tool-key-0123456789abcdef
      INTERNAL_API_BASE_URL: http://127.0.0.1:8000/ci-clinicpilot-0123456789/
      DATABASE_URL: sqlite:////app/data/clinicpilot.db
      DEFAULT_MODEL: local
      LOCAL_MODEL_BASE_URL: http://model-stub:9000/v1
      LOCAL_MODEL_ID: clinicpilot-e2e-stub
      LOCAL_MODEL_TIMEOUT_SECONDS: "15"
      DEEPSEEK_MODEL: ci-model-stub
      DEEPSEEK_BASE_URL: http://model-stub:9000/v1
      DEEPSEEK_TIMEOUT_SECONDS: "15"
    ports:
      - "127.0.0.1:${CLINICPILOT_TEST_PORT:-8000}:8000"
    depends_on:
      model-stub:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 24

  model-stub:
    image: python:3.12-slim-bookworm
    command:
      - python
      - /app/model_stub.py
      - --host
      - 0.0.0.0
      - --port
      - "9000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests/e2e/model_stub.py:/app/model_stub.py:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2).read()
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    networks:
      - clinicpilot
